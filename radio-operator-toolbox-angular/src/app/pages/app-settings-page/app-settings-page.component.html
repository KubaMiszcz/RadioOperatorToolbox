<div class="card mb-4">
    <h5 class="card-header p-1">Ustawienia</h5>
    <div class="card-body">
        <div class="d-flex flex-row justify-content-between">
            <label class="form-check-label" for="flexCheckDefault22">
                pokaz/ukryj wszystkie wskazowki
            </label>
            <div class="form-check">
                <input [(ngModel)]="appSettings.showAllHelpTooltips" class="form-check-input" type="checkbox" value=""
                    id="flexCheckDefault22">
            </div>
        </div>

        <div class="input-group p-1 mb-2 w-100">
            <span class="input-group-text  w-25">my Team:</span>
            <button class="btn btn-secondary-outline dropdown-toggle m-0 w-75" type="button" id="dropdownMenuButton3"
                data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                {{appData.myTeam?.name}} - {{appData.myTeam?.codename}}
            </button>
            <div class="dropdown-menu" aria-labelledby="dropdownMenuButton2">
                <div *ngFor="let team of appData.tdrData?.teams" class="dropdown-item" (click)="setMyTeam(team)">
                    {{team.name}} -
                    {{team.codename}}</div>
            </div>
        </div>

        <div class="d-flex flex-row justify-content-between">
            <label class="form-check-label" for="flexCheckDefault">
                Dark Theme
            </label>
            <div class="form-check">
                <input [(ngModel)]="appSettings.IsDarkModeOn" class="form-check-input" type="checkbox" value=""
                    id="flexCheckDefault">
            </div>
        </div>
    </div>
</div>






<div class="card mb-4">
    <h5 class="card-header">Application Settings ({{appSettingsJSON.length}})</h5>
    <div class="card-body">
        <textarea [(ngModel)]="appSettingsJSON" class="form-control" rows="5" cols="1000" aria-label="Default"
            aria-describedby="inputGroup-sizing-default"></textarea>
    </div>
    <div class="card-footer d-flex justify-content-between ">
        <button type="button" name="" id="" class="btn btn-primary btn-lg btn-block col-4"
            [cdkCopyToClipboard]="appSettingsJSON"
            (cdkCopyToClipboardCopied)="alert('Application Settings skopiowane do schowka')">
            Export<i class="fa fa-copy mx-1" aria-hidden="true"></i></button>
        <button type="button" name="" id="" class="btn btn-primary btn-lg btn-block col-4" (click)="importAppSettings()">
            Import <i class="fa fa-paste mx-1" aria-hidden="true"></i>
        </button>
    </div>
</div>




<div class="card mb-4">
    <h5 class="card-header">Application Data ({{appDataJSON.length}})</h5>
    <div class="card-body">
        <textarea [(ngModel)]="appDataJSON" class="form-control" rows="5" cols="1000" aria-label="Default"
            aria-describedby="inputGroup-sizing-default"></textarea>
    </div>

    <div class="card-footer d-flex justify-content-between">
        <button type="button" name="" id="" class="btn btn-primary btn-lg btn-block col-4"
            [cdkCopyToClipboard]="appDataJSON"
            (cdkCopyToClipboardCopied)="alert('Application Data skopiowane do schowka')">
            Export<i class="fa fa-copy mx-1" aria-hidden="true"></i></button>
        <button type="button" name="" id="" class="btn btn-primary btn-lg btn-block col-4" (click)="importAppData()">
            Import
            <i class="fa fa-paste mx-1" aria-hidden="true"></i>
        </button>
    </div>
</div>
